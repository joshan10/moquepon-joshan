<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combate - ¡Mokepon!</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <section id="elegir-ataque">
        <h1 class="titulo">Mokepon</h1>
        <h2 class="subtitulo">Elige tu ataque:</h2>

        <div id="lista-ataques" class="contenedor-tarjetas"></div>

        <div id="caja-mensajes">
            <p id="texto-resultado">Mucha suerte</p>
            <section id="zona-reiniciar" hidden>
                <button id="btn-reiniciar" class="boton-principal">Reiniciar</button>
            </section>
        </div>

        <div class="historial">
            <div class="columna">
                <p id="marcador-propio">0</p>
                <p id="nombre-jugador"></p>
                <div id="historial-jugador"></div>
            </div>
            <div class="columna">
                <p id="marcador-rival">0</p>
                <p id="nombre-enemigo"></p>
                <div id="historial-enemigo"></div>
            </div>
        </div>
    </section>

    <script src="./js/comun.js"></script>
    <script src="./js/combate.js"></script>
</body>

</html>
